<head>
<meta charset="UTF-8">

<title>The Cake Cart — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #FBF7F2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .logo { width: 140px; height: auto; border-radius: 16px; margin-bottom: 20px; }
  .title { font-family: 'Playfair Display', serif; font-size: 28px; color: #3D2B1F; font-weight: 700; margin-bottom: 4px; text-align: center; }
  .subtitle { font-size: 13px; color: #B09080; margin-bottom: 32px; text-align: center; }
  .box {
    width: 100%; max-width: 360px;
    background: #FEFCFA;
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 8px 40px rgba(61,43,31,0.1);
  }
  .label { font-size: 12px; font-weight: 600; color: #7A5A4A; text-transform: uppercase; letter-spacing: 0.4px; display: block; margin-bottom: 8px; }
  .input {
    width: 100%; padding: 14px 16px;
    border: 1px solid rgba(61,43,31,0.2);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    color: #2A1810;
    background: #FBF7F2;
    outline: none;
    margin-bottom: 16px;
  }
  .input:focus { border-color: #C47A6E; box-shadow: 0 0 0 3px rgba(196,122,110,0.15); }
  .btn {
    width: 100%; padding: 15px;
    background: #3D2B1F;
    color: #FEFCFA;
    border: none;
    border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.85; }
  .error {
    background: #FDE8E8;
    color: #B83A3A;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
    text-align: center;
    display: none;
  }
  .error.show { display: block; }
  .footer { font-size: 11px; color: #B09080; margin-top: 24px; text-align: center; }
</style>
</head>

<script>
const PASSWORD = 'sahibo_re_govaliyo_re';
function login() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  if(pw === PASSWORD) {
    // Store auth in sessionStorage so app page knows we're logged in
    sessionStorage.setItem('tcc_auth', 'yes');
    // Redirect to main app
    window.location.href = 'app.html';
  } else {
    err.classList.add('show');
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}
// If already authenticated, skip login
if(sessionStorage.getItem('tcc_auth') === 'yes') {
  window.location.href = 'app.html';
}
</script>
